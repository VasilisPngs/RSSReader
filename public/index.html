<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSSReader</title>
<meta name="description" content="Private RSS reader with server-side fetching and offline reading.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://w.soundcloud.com https://open.spotify.com https://www.dailymotion.com https://geo.dailymotion.com https://platform.twitter.com https://platform.x.com https://www.instagram.com https://instagram.com https://www.facebook.com https://web.facebook.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0c0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RSSReader">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/app/styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="brand" href="/" data-link>
      <img class="brand-mark" src="/icons/icon.svg" alt="" width="26" height="26">
      <span class="brand-name">RSSReader</span>
    </a>
    <button id="sync-pill" class="pill" type="button" aria-live="polite">Synced</button>
  </header>
  <nav id="sidebar" class="sidebar" aria-label="Feeds"></nav>
  <main id="view" class="view"></main>
  <nav class="tabbar">
    <a class="tab" href="/" data-link data-route="articles">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Articles</span>
    </a>
    <a class="tab" href="/feeds" data-link data-route="feeds">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19a1 1 0 100-2 1 1 0 000 2M5 12a7 7 0 017 7M5 5a14 14 0 0114 14"/></svg>
      <span>Feeds</span>
    </a>
    <a class="tab" href="/settings" data-link data-route="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.61 9.37A9 9 0 0 1 20.61 14.63L18.12 13.87A6.4 6.4 0 0 1 16.68 16.36L18.58 18.14A9 9 0 0 1 14.02 20.77L13.44 18.24A6.4 6.4 0 0 1 10.56 18.24L9.98 20.77A9 9 0 0 1 5.42 18.14L7.32 16.36A6.4 6.4 0 0 1 5.88 13.87L3.39 14.63A9 9 0 0 1 3.39 9.37L5.88 10.13A6.4 6.4 0 0 1 7.32 7.64L5.42 5.86A9 9 0 0 1 9.98 3.23L10.56 5.76A6.4 6.4 0 0 1 13.44 5.76L14.02 3.23A9 9 0 0 1 18.58 5.86L16.68 7.64A6.4 6.4 0 0 1 18.12 10.13L20.61 9.37Z"/><circle cx="12" cy="12" r="2.6"/></svg>
      <span>Settings</span>
    </a>
  </nav>
</div>
<div id="sheet-host"></div>
<div id="toast-host" class="toast-host" role="status" aria-live="polite"></div>
<script type="module" src="/app/main.js"></script>
</body>
</html>
